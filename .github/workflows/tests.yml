name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Same images as docker-compose.yml, so CI tests against the real thing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: settlement
          POSTGRES_PASSWORD: settlement-local-dev
          POSTGRES_DB: settlement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settlement"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
